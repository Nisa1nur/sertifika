<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sertifika</title>
    <style>
      body {
        background-color: white;
        display: flex; /*hizalama */
        justify-content: center;/* ana ekranda genelde yatayda hizalar*/
        align-items: center; /* dikeyde ortalar*/
        min-height: 100vh;/*Sayfadaki içerik az olduğunda alt bilginin 
         ekranın ortasında kalmasını engellemek ve sayfa düzenini tam ekrana oturtmak için kullanılır. */
        margin: 0;/*dış boşluk bırakmaz */
        font-family: Arial, Helvetica, sans-serif;/* yazı tipi*/
      }
      .card-outher {/* kartın dışı*/
        background-color: #ffffff;
        padding: 10px;/*içerik ile kenarlığı arasındaki iç boşluğu 4 bir taraftan da 
        12 piksel olacak şekilde ayarlar. */
        border-radius: 28px;/*kartın köşelerini yumuşatır */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);/*gölge efekti */
        width: 500px;/*kartın genişliği 500px */
        box-sizing: border-box;/*iç dış boşluk verildiğinde ekranı bozmaz */
      }
      .card-inner{/*kartın iç kısmı */
        border: 5px solid black;/*5px siyah çizgi çerçeve çizgisi*/
        border-radius: 28px;/*köşesini yumuşatmak için*/
        padding: 25px 30px 35px 30px;/*saat yönü sırasıyla farklı ölçülerde iç boşluk verir.*/
        text-align: center;/*yatayda hizalar*/
      }
      h1{
        font-size: 30px;/*yazı büyüklüğü*/
        font-weight: 900;/*yazı kalınlığı*/
        letter-spacing: 2px;/*harfler arası boşluk*/
        margin: 0 0 35px 0 ;
        color: black;
        text-transform: uppercase;/*bütün harfleri büyük yazar*/
      }
      .content{/*içerik*/
        display: flex;/*hizalama*/
        align-items: center;/*dikeyde ortalar*/
        justify-content: space-between;/*İlk Eleman: En sola (veya başlangıca) tamamen yapışır.Son Eleman: En sağa (veya sona) tamamen yapışır.
Aradaki Elemanlar: Kalan boşluğu kendi aralarında eşit miktarda paylaşır.*/
        padding: 0 10px;
      }
      .image{
        flex: 1;/*resim için ayrılan boşluk*/
        display: flex;/*hizalama*/
        justify-content: center;/*ana ekranda genelde yatayda hizalar*/
        align-items: center;/*dikeyde ortalar*/
      }
      .product-image{
        max-width: 120px;/*resim büyük olursa 120-120 olması için*/
        max-height: 120px;/*resim büyük olursa 120-120 olması için*/
        object-fit: contain;/*resmin oranı bozulmasın diye*/
      }
      .details-table{
        flex: 1.3;/*tabloya ayrılan yer*/
        border-collapse: collapse;/*kartın etrafındaki çizgi*/
        text-align: left;/*sola yaslar*/
      }
      .details-table td{
        padding: 4px 0;/*üstten-alttan 4px, sağdan-soldan ise 0px*/
        font-size: 20px;/*yazı büyüklüğü*/
        font-weight: bold;/*yazıyı kalın yapar*/
        color: black;
        white-space: nowrap;/*tek satırda kalsın diye taşarsa alta geçmesin*/
      }
      .details-table td.colon{
        padding: 0 12px;
        text-align: center;/*yatayda hizalar*/
        width: 10px;/*10px genişlik*/
      }
    </style>
</head>
<body>
    <div class="card-outher">
      <div class="card-inner">
         <h1>CERTIFICATE</h1>
         <div class="content">
            <div class="image">
                <img src="yuzuk1.png" alt="ürün görseli" class="product-image">
            </div>
            <table class="details-table">
                <tr>
                    <td>Diamond</td>
                    <td class="colon">:</td>
                    <td id="val-karat">0.51 ct.</td>
                </tr>
                <tr>
                    <td>Color</td>
                    <td class="colon">:</td>
                    <td id="val-renk">E</td>
                </tr>
                <tr>
                    <td>Clarity</td>
                    <td class="colon">:</td>
                    <td id="val-berraklik">VS</td>
                </tr>
                <tr>
                    <td>Gold</td>
                    <td class="colon">:</td>
                    <td id="val-altin">14K</td>
                </tr>
                <tr>
                    <td>Gram</td>
                    <td class="colon">:</td>
                    <td id="val-gram">1.77 gr.</td>
                </tr>
            </table>
         </div>
     </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {                                          // her şeyi güvenli bir kutuya al, çakışma olmasın
  const SUPABASE_URL = "https://qmyrpykooipxyfwaepyz.supabase.co";   // veritabanının adresi
  const SUPABASE_KEY = "sb_publishable_jqpVe_hmhbkPOpZ8TIVCfw_P-qkIjyO";           // veritabanına giriş anahtarı

  const sertifikaDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);  // veritabanına bağlan

  async function sertifikayiGetir() {                    // "sertifika getir" adında bir görev tanımla
    const id = new URLSearchParams(window.location.search).get("id");  // linkteki ?id=... kodunu oku
    const durum = document.getElementById("durum");       // uyarı mesajı yazılacak alanı bul

    if (!id) {                                            // eğer linkte id yoksa
      durum.textContent = "Linkte sertifika kodu bulunamadı.";  // uyarı yaz
      return;                                             // ve dur, devam etme
    }

    const { data, error } = await sertifikaDb             // veritabanına sor:
      .from("sertifikalar")                               // "sertifikalar" tablosuna bak
      .select("*")                                        // her sütunu getir
      .eq("id", id)                                       // ama sadece id'si eşleşen satırı
      .single();                                          // tek sonuç bekliyorum

    if (error || !data) {                                 // eğer hata varsa veya veri bulunamadıysa
      durum.textContent = "Bu koda ait sertifika bulunamadı.";  // uyarı yaz
      return;                                             // ve dur
    }

    document.getElementById("val-karat").textContent = data.karat;          // karat bilgisini yaz
    document.getElementById("val-renk").textContent = data.renk;            // renk bilgisini yaz
    document.getElementById("val-berraklik").textContent = data.berraklik;  // berraklık bilgisini yaz
    document.getElementById("val-altin").textContent = data.altin;         // altın ayarını yaz
    document.getElementById("val-gram").textContent = data.gram;           // gram bilgisini yaz
  }                                                        
  sertifikayiGetir();                                      // görevi şimdi çalıştır
})();                                                     
</script>

</body>
</html>
